amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: scan
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.15
    update_min_a: 0.2
    laser_max_range: 12.0
    laser_min_range: 0.12

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    default_nav_to_pose_bt_xml: "$(find-pkg-share nav2_bt_navigator)/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0          # naik dari 10.0 ? update trajectory lebih sering, gerakan lebih responsif & halus
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      max_vel_x: 0.15
      min_vel_x: 0.0
      max_vel_theta: 0.6                # turun dari 1.0 ? lebih seimbang dengan max_vel_x, kurangi kesan "muter cepat"
      min_vel_theta: -0.6
      acc_lim_x: 0.5                    # turun dari 1.0 ? akselerasi maju lebih halus, kurangi sentakan
      acc_lim_theta: 1.2                # turun dari 2.0 ? transisi rotasi lebih smooth
      decel_lim_x: -0.5
      decel_lim_theta: -1.2
      vx_samples: 20                    # naik dari 10 ? lebih banyak opsi trajectory dievaluasi, hasil lebih optimal
      vtheta_samples: 20
      sim_time: 1.5
      xy_goal_tolerance: 0.15           # naik dari 0.1 ? sesuai catatan sebelumnya, kurangi kegagalan "goal reached"
      trans_stopped_velocity: 0.05
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 24.0             # turun dari 32.0 ? kurangi "obsesi" align presisi ke path, biar gerakan lebih natural
      GoalAlign.scale: 20.0             # turun dari 24.0
      PathDist.scale: 24.0              # turun dari 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 20.0          # turun dari 32.0 ? kurangi kecenderungan robot "muter dulu baru maju" berulang

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.05
      robot_radius: 0.10
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.3
          obstacle_range: 3.0
          raytrace_range: 3.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.15

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      robot_radius: 0.10
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.3
          obstacle_range: 3.0
          raytrace_range: 3.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.15

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/home/amr/amr_ws/maps/ruangan_pertama.yaml"

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.2
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 500000

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    max_velocity: [0.15, 0.0, 1.0]
    min_velocity: [-0.15, 0.0, -1.0]
